name: Build authored UE5 gameplay scene and attempt real rendered verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gameplay-scene
  cancel-in-progress: false
jobs:
  scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare capacity and pinned authored scene with authorized test character
        env:
          UE_REGISTRY_TOKEN: ${{ secrets.UE_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          mkdir -p artifacts/gameplay-scene
          python3 -c 'import shutil; assert shutil.disk_usage("/var/lib/docker").free > 85*1024**3'
          python3 tools/scene/prepare_sources.py
      - name: Pull licensed pinned engine image
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ue-registry-auth
          UE_REGISTRY_TOKEN: ${{ secrets.UE_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$UE_REGISTRY_TOKEN" | docker login ghcr.io --username tobirama2904-cell --password-stdin
          IMAGE=$(python3 -c 'import json; print(json.load(open("BuildData/engine.lock.json"))["reference"])')
          timeout --foreground 20m docker pull "$IMAGE"
      - name: Prepare software-rendering attempt (no hardware GPU claimed)
        run: |
          set -euo pipefail
          IMAGE=$(python3 -c 'import json; print(json.load(open("BuildData/engine.lock.json"))["reference"])')
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
          docker run -d --name scene-editor --user root --cpus=4 --memory=13g --memory-swap=13g --shm-size=1g \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/project" --entrypoint /bin/bash "$IMAGE" -lc 'sleep infinity'
          docker exec scene-editor bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mesa-vulkan-drivers libvulkan1 xvfb xauth vulkan-tools'
          docker network disconnect bridge scene-editor
      - name: Compile native game and construct actual map — attempt 1
        id: attempt1
        continue-on-error: true
        run: docker exec -u ue4 scene-editor bash /project/tools/scene/editor_gate.sh
      - name: Expose measured failure diagnostics from attempt 1
        if: steps.attempt1.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-attempt-1-${{ github.run_id }}
          path: |
            artifacts/gameplay-scene/*.json
            artifacts/gameplay-scene/*.log
          retention-days: 3
      - name: Bounded repair window 1 without another engine download
        if: steps.attempt1.outcome == 'failure'
        run: sudo python3 tools/scene/wait_for_correction.py
      - name: Compile native game and construct actual map — attempt 2
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        run: docker exec -u ue4 scene-editor bash /project/tools/scene/editor_gate.sh
      - name: Expose measured failure diagnostics from attempt 2
        if: steps.attempt2.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-attempt-2-${{ github.run_id }}
          path: |
            artifacts/gameplay-scene/*.json
            artifacts/gameplay-scene/*.log
          retention-days: 3
      - name: Bounded repair window 2 without another engine download
        if: steps.attempt2.outcome == 'failure'
        run: sudo python3 tools/scene/wait_for_correction.py
      - name: Compile native game and construct actual map — attempt 3
        id: attempt3
        if: steps.attempt2.outcome == 'failure'
        continue-on-error: true
        run: docker exec -u ue4 scene-editor bash /project/tools/scene/editor_gate.sh
      - name: Expose measured failure diagnostics from attempt 3
        if: steps.attempt3.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-attempt-3-${{ github.run_id }}
          path: |
            artifacts/gameplay-scene/*.json
            artifacts/gameplay-scene/*.log
          retention-days: 3
      - name: Require a successful native scene construction
        run: test -s artifacts/gameplay-scene/scene-ready.json && test -s artifacts/gameplay-scene/field-content.json
      - name: Preserve private editable project content (not a playable release)
        env:
          GH_TOKEN: ${{ secrets.UE_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/tobirama2904-cell/poco-ue5-engine-cache --jq .private)" = true
          docker exec -u ue4 scene-editor bash -lc '
            cd /project
            mkdir -p .cache/private-scene
            tar -czf .cache/private-scene/game-content.tar.gz Content
            sha256sum .cache/private-scene/game-content.tar.gz > .cache/private-scene/SHA256SUMS
          '

          gh release create "scene-${GITHUB_RUN_ID}" .cache/private-scene/* --repo tobirama2904-cell/poco-ue5-engine-cache \
            --prerelease --title "Private editable development map ${GITHUB_RUN_ID}" \
            --notes 'Authored map and licensed temporary animation-test character. NOT final game content. NOT an APK.'
      - name: Render actual gameplay and require input/floor proof — attempt 1
        id: render1
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          test -s artifacts/gameplay-scene/scene-construction.json
          docker exec -u ue4 scene-editor bash /project/tools/scene/render_gate.sh
      - name: Expose first-frame render failure before bounded correction
        if: steps.render1.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-render-attempt-1-${{ github.run_id }}
          path: |
            artifacts/gameplay-scene/*.json
            artifacts/gameplay-scene/*.log
            artifacts/gameplay-scene/*.png
          retention-days: 3
      - name: Bounded render repair window (reuse engine and content)
        if: steps.render1.outcome == 'failure'
        run: sudo python3 tools/scene/wait_for_correction.py
      - name: Rebuild corrected scene and retry verified game rendering
        if: steps.render1.outcome == 'failure'
        run: |
          docker exec -u ue4 scene-editor bash /project/tools/scene/editor_gate.sh
          docker exec -u ue4 scene-editor bash /project/tools/scene/render_gate.sh
      - name: Require actual screenshot and runtime proof, not optional-step success
        run: python3 -c 'import json; assert json.load(open("artifacts/gameplay-scene/render-verification.json"))["gate_passed"]'
      - name: Refresh retained private map after measured corrections
        if: steps.render1.outcome == 'failure' && success()
        env:
          GH_TOKEN: ${{ secrets.UE_REGISTRY_TOKEN }}
        run: |
          docker exec -u ue4 scene-editor bash -lc 'cd /project && tar -czf .cache/private-scene/game-content.tar.gz Content && sha256sum .cache/private-scene/game-content.tar.gz > .cache/private-scene/SHA256SUMS'
          gh release upload "scene-${GITHUB_RUN_ID}" .cache/private-scene/* --clobber --repo tobirama2904-cell/poco-ue5-engine-cache
      - name: Upload verification only, never licensed content or binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gameplay-scene-diagnostics-${{ github.run_id }}
          path: |
            artifacts/gameplay-scene/*.json
            artifacts/gameplay-scene/*.log
            artifacts/gameplay-scene/*.png
            artifacts/engine-probe/unreal-integration.json
            artifacts/engine-probe/*.sav
          retention-days: 7
